
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Forecast App</title>
</head>
<body>

    <h1>Weather Forecast Application</h1>

    <h2>Select Location</h2>

    <button onclick="getGPSLocation()">Use My GPS</button>
    <button onclick="getWeather()">Manual Location</button>

    <p id="locationResult"></p>

    <hr>

    <div id="weatherResult"></div>

    <div id="forecastResult"></div>

    <script>

        const apiKey = "9a262c214ba051a758e71c562d21a2fe";

        async function getWeather() {

            const city = prompt("Enter a city name");

            if (!city) {
                alert("No city entered");
                return;
            }

            const url =
                `https://api.openweathermap.org/data/2.5/weather?q=${encodeURIComponent(city)}&appid=${apiKey}&units=metric`;

            try {

                const response = await fetch(url);

                if (!response.ok) {
                    throw new Error("City not found");
                }

                const data = await response.json();

                getWeatherByCoordinates(
                    data.coord.lat,
                    data.coord.lon
                );

            } catch (error) {

                alert("Error: " + error.message);

            }
        }

        async function getGPSLocation() {
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        getWeatherByCoordinates(
                            position.coords.latitude,
                            position.coords.longitude
                        );
                    },
                    (error) => {
                        alert("Error getting GPS location: " + error.message);
                    }
                );
            } else {
                alert("Geolocation is not supported by this browser.");
            }
        }

        async function getWeatherByCoordinates(lat, lon) {
            const url = `https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&appid=${apiKey}&units=metric`;

            try {
                const response = await fetch(url);

                if (!response.ok) {
                    throw new Error("Weather data not found");
                }

                const data = await response.json();

                // Display weather information
                document.getElementById("weatherResult").innerHTML = `
                    <h3>Current Weather</h3>
                    <p><strong>Temperature:</strong> ${data.main.temp}°C</p>
                    <p><strong>Feels Like:</strong> ${data.main.feels_like}°C</p>
                    <p><strong>Humidity:</strong> ${data.main.humidity}%</p>
                    <p><strong>Wind Speed:</strong> ${data.wind.speed} m/s</p>
                `;

            } catch (error) {
                alert("Error: " + error.message);
            }
        }
    function getGPSLocation() {

    if (!navigator.geolocation) {
        alert("Geolocation is not supported by your browser.");
        return;
    }

    document.getElementById("locationResult").innerHTML =
        "Getting your location...";

    navigator.geolocation.getCurrentPosition(

        function(position) {

            const latitude = position.coords.latitude;
            const longitude = position.coords.longitude;

            getWeatherByCoordinates(latitude, longitude);

        },

        function(error) {

            document.getElementById("locationResult").innerHTML = "";

            alert("GPS Error: " + error.message);

        }

    );
}

    </script>

</body>
</html>
