<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maps</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin="" />

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""></script>
</head>
<style>
    #map {
        height: 800px;
    }

    .popup-image {
        max-width: 200px;
        height: auto;
        object-fit: fill;
    }
</style>
<body>
    <h1>Simple Map</h1>
    <div id="map"></div>
</body>
<script>
    function initMap() {
        // Render map
        const map = L.map('map').setView([8.360, 124.868], 17);


        // Render pins
        const mapDataUrl = 'campus.map.json';

        //OpenStreetMap Layer
        const openStreetMap = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        });

        //satellite Layer
        const satellite = L.tileLayer(
        'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
        {attribution: 'Tiles (c) Esri -, Maxar, Earthstar Geographics, & GIS User Community'
        });
        
        satellite.addTo(map);
        
        fetch(mapDataUrl)
            .then(response => response.json())
            .then(data => {

                data.forEach(pin => {
                    const marker = L.marker([pin.lat, pin.long]).addTo(map);

                    const image = `<img src="${pin.img}" class="popup-image">`;

                    marker.bindPopup(`
                        ${pin.title}<br>
                        <hr>
                        ${image}
                    `);

                });

                //layer control
                const baseMaps = {
                    "OpenStreetMap": openStreetMap,
                    "Satellite": satellite
                }

                L.control.layers(baseMaps).addTo(map);
            });

    }


    initMap();

</script>

</html>
